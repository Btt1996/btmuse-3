name: Btt Music 2.00 iOS Build & IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ios-ipa.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ios-ipa.yml'
  workflow_dispatch:

jobs:
  analyze-test-and-ipa:
    name: Analyze, Test & Build iOS IPA (com.ahmed.btmu)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Bundle Identifier
        run: |
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.ahmed.btmu;" ios/Runner.xcodeproj/project.pbxproj

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Run Dart static analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit tests
        run: flutter test

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Release Runner.app (--no-codesign)
        env:
          X2_BACKEND_URL: ${{ vars.X2_BACKEND_URL || '' }}
          PIPED_API_URL: ${{ vars.PIPED_API_URL || '' }}
          INVIDIOUS_API_URL: ${{ vars.INVIDIOUS_API_URL || '' }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=X2_BACKEND_URL="$X2_BACKEND_URL" \
            --dart-define=PIPED_API_URL="$PIPED_API_URL" \
            --dart-define=INVIDIOUS_API_URL="$INVIDIOUS_API_URL"

      - name: Package Unsigned Payload IPA
        run: |
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned_ipa/Payload/
          cd build/ios/unsigned_ipa
          zip -r ../btmu-2.00-unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btmu-unsigned-ipa
          path: flutter_app/build/ios/btmu-2.00-unsigned.ipa

      - name: Sign & Export Installable IPA (when Apple Signing Secrets exist)
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IPA_EXPORT_METHOD || 'ad-hoc' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ahmed.btmu</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/signed_ipa

      - name: Upload Signed Installable IPA
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: btmu-signed-ipa
          path: flutter_app/build/ios/signed_ipa/*.ipa
