name: btmu
description: "Btt Music 2.00 — Offline-first iOS audio player, X1 identification, X2 acquisition, Telegram sync & Smart Remix."
publish_to: "none"
version: 2.0.0+30

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  file_picker: ^8.1.4
  record: ^5.1.3
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
