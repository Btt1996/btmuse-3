    <!-- Pre-paint theme (Phase 2, Stream C) + WebSocket Error Suppressor.
         This synchronous inline script runs in <head>, before <body> is
         parsed and before first paint. It reads localStorage['bttm_theme_mode']
         (default 'dark' — matching the React default in src/App.tsx, which
         defaults to dark on first run) and adds/removes the `dark` class on
         documentElement immediately, so a fresh load never flashes the light
         theme before React mounts. It only READS the stored value; the
         Settings toggle (toggleTheme in App.tsx) still owns writing it.
         The theme-color metas above stay as they are. -->
    <script>
      (function() {
        // Suppress benign WebSocket / Vite HMR disconnection errors in iframe environment
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (
            msg && (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1 ||
              msg.indexOf('@vite/client') !== -1
            )
          ) {
            event.preventDefault();
          }
        });

        function applyUserTheme() {
          var stored = null;
          try {
            stored = localStorage.getItem('bttm_theme_mode');
          } catch (e) {
            stored = null; // storage unavailable: fall through to the dark default
          }
          // Default is dark: only an explicit stored 'light' opts out. The OS
          // preference is deliberately NOT consulted here — the app is
          // dark-first and React defaults to dark on first run, so following
          // the OS would flash light and then flip to dark after mount.
          var isDark = stored ? stored === 'dark' : true;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
        }
        applyUserTheme();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            try {
              if (!localStorage.getItem('bttm_theme_mode')) applyUserTheme();
            } catch (e) {
              // storage unavailable: keep the class already applied
            }
          });
        }
      })();
    </script>
